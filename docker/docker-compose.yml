# Corvus demo stack (D-03): FastAPI + MLflow + PostgreSQL.
#
# OQ2 decision (zero migration): the mlflow service fronts the file store —
# the same store the D-01 promotion wrote — instead of migrating runs to a
# Postgres backend. Phase 5 can revisit if drift reads need SQL access.
#
# Windows-host NOTE (Task 3 Rule 3 fix): the file store records ABSOLUTE
# Windows artifact URIs (c:\...\mlruns/...), which a Linux container cannot
# resolve even with the directory mounted — every models:/ / runs:/ artifact
# read fails with "No such artifact". The fix is a synced copy with ONLY the
# location prefix rebased to /mlruns (run IDs, versions, stages, artifact
# bytes untouched — still the D-01 v9). Regenerate after any new
# training/promotion, before compose up:
#     .\venv\python.exe docker/sync_mlruns_container.py
# Host mlruns/ is never modified by the sync.
#
# NOTE on relative paths: compose resolves them from this file's directory
# (docker/), so the project root is ".." for the build context while the
# container-ready store lives alongside this file ("./.mlruns.container").
# A bare host-mlruns mount would serve Windows-absolute artifact URIs the
# Linux containers cannot read (see OQ2 note above).
#
# Credentials are dev-only corvus/corvus for the local demo (T-03-12,
# accepted): real secrets never commit — .env stays gitignored.
services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_USER: corvus
      POSTGRES_PASSWORD: corvus
      POSTGRES_DB: corvus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvus -d corvus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg2://corvus:corvus@db:5432/corvus
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_VERSION_V2: "15"
    volumes:
      # Container-readable registry copy (see OQ2 note): the loader resolves
      # models:/ + runs:/ artifact URIs to /mlruns paths inside this box.
      - ./.mlruns.container:/mlruns
      # Dev convenience: source comes from the repo, so api/ or src/ edits
      # apply on restart instead of a 1.8 GB pip-layer rebuild. Harmless
      # once the image is rebuilt (identical bytes shadowed, read-only).
      - ../api:/app/api:ro
      - ../src:/app/src:ro
      - ../config:/app/config:ro
    depends_on:
      db:
        condition: service_healthy

  mlflow:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    env_file:
      - ../.env
    volumes:
      - ./.mlruns.container:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns --default-artifact-root file:///mlruns --allowed-hosts "mlflow:*,localhost:*,127.0.0.1:*"
    depends_on:
      db:
        condition: service_healthy

  # Phase 4 monitoring — the three scrape targets prometheus.yml already
  # names. Without them Prometheus reports 4 of 6 targets down and alerts.yml
  # has nowhere to fire, so the dashboard looks broken in a demo.
  node-exporter:
    restart: unless-stopped
    image: prom/node-exporter:v1.8.1

  postgres-exporter:
    restart: unless-stopped
    image: prometheuscommunity/postgres-exporter:v0.15.0
    environment:
      DATA_SOURCE_NAME: postgresql://corvus:corvus@db:5432/corvus?sslmode=disable
    depends_on:
      db:
        condition: service_healthy

  alertmanager:
    restart: unless-stopped
    image: prom/alertmanager:v0.27.0
    ports:
      - "9093:9093"

  # Phase 5 — retraining orchestrator. Reuses the api image (requirements.txt
  # already pins apache-airflow + evidently), so only the DAG and the data it
  # reads are mounted. `standalone` = scheduler + webserver + sqlite metadata
  # in one container.
  # ponytail: SequentialExecutor/sqlite is demo-only; move to LocalExecutor +
  # the existing postgres for anything that has to survive a restart.
  airflow:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["airflow", "standalone"]
    ports:
      - "8080:8080"
    env_file:
      - ../.env
    environment:
      AIRFLOW_HOME: /opt/airflow
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /app/airflow/dags
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "False"
      CORVUS_PROJECT_ROOT: /app
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg2://corvus:corvus@db:5432/corvus
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ../airflow/dags:/app/airflow/dags:ro
      - ../src:/app/src:ro
      - ../api:/app/api:ro
      - ../config:/app/config:ro
      - ../data:/app/data:ro
      # Decision JSON and the labelled batch are written here, so this one rw.
      - ../reports:/app/reports
      - airflow-home:/opt/airflow
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started

  frontend:
    restart: unless-stopped
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_started

  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v2.50.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules:/etc/prometheus/rules:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      api:
        condition: service_started
      mlflow:
        condition: service_started

  grafana:
    restart: unless-stopped
    image: grafana/grafana:10.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: corvus-grafana
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  prometheus-data:
  grafana-data:
  airflow-home:
