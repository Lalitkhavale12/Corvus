# Corvus demo stack (D-03): FastAPI + MLflow + PostgreSQL.
#
# OQ2 decision (zero migration): the mlflow service fronts the file store —
# the same store the D-01 promotion wrote — instead of migrating runs to a
# Postgres backend. Phase 5 can revisit if drift reads need SQL access.
#
# Windows-host NOTE (Task 3 Rule 3 fix): the file store records ABSOLUTE
# Windows artifact URIs (c:\...\mlruns/...), which a Linux container cannot
# resolve even with the directory mounted — every models:/ / runs:/ artifact
# read fails with "No such artifact". The fix is a synced copy with ONLY the
# location prefix rebased to /mlruns (run IDs, versions, stages, artifact
# bytes untouched — still the D-01 v9). Regenerate after any new
# training/promotion, before compose up:
#     .\venv\python.exe docker/sync_mlruns_container.py
# Host mlruns/ is never modified by the sync.
#
# NOTE on relative paths: compose resolves them from this file's directory
# (docker/), so the project root is ".." for the build context while the
# container-ready store lives alongside this file ("./.mlruns.container").
# A bare host-mlruns mount would serve Windows-absolute artifact URIs the
# Linux containers cannot read (see OQ2 note above).
#
# Credentials are dev-only corvus/corvus for the local demo (T-03-12,
# accepted): real secrets never commit — .env stays gitignored.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: corvus
      POSTGRES_PASSWORD: corvus
      POSTGRES_DB: corvus
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corvus -d corvus"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://corvus:corvus@db:5432/corvus
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # Container-readable registry copy (see OQ2 note): the loader resolves
      # models:/ + runs:/ artifact URIs to /mlruns paths inside this box.
      - ./.mlruns.container:/mlruns
    depends_on:
      db:
        condition: service_healthy

  mlflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./.mlruns.container:/mlruns
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri file:///mlruns --default-artifact-root file:///mlruns --allowed-hosts "mlflow:*"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
