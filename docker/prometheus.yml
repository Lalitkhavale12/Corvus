# Prometheus configuration for Corvus CKD Prediction API (Phase 4)
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'corvus-api'
    static_configs:
      - targets:
          - api:8000
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'mlflow'
    static_configs:
      - targets:
          - mlflow:5000
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'postgres-exporter'
    static_configs:
      - targets:
          - postgres-exporter:9187
    metrics_path: /metrics
    scrape_interval: 15s

  - job_name: 'node-exporter'
    static_configs:
      - targets:
          - node-exporter:9100
    metrics_path: /metrics
    scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml