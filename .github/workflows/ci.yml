name: CI

# No soft failures: if a suite or build is red, the branch is red. Docker image
# builds and deployment are intentionally absent until they can be verified
# locally - a job nobody has run is not a gate.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Matches the local virtualenv used for the verified test run.
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c security-constraints.txt

      - name: Run tests
        # The real NHANES CSV splits and the MLflow store are gitignored, so
        # the suite stubs their loaders and skips the data-dependent tests.
        run: python -m pytest tests -q

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

# Playwright stays local: it needs the running Docker stack, seeded users and
# the Postgres log store. Run `npm run e2e` after `docker compose up`.
