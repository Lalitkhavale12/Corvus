# Corvus pipeline configuration

data:
  raw_path: "data/raw/kidney_disease.csv"
  processed_dir: "data/processed"
  validation_dir: "data/validation"
  target_column: "classification"
  positive_label: "ckd"          # value in target_column meaning "disease present"
  id_column: "id"                # dropped from features if present; preserved as __source_id lineage sidecar
  numeric_cols: ["age", "bp", "sg", "al", "su", "bgr", "bu", "sc", "sod", "pot",
    "hemo", "pcv", "wc", "rc"]
  categorical_cols: ["rbc", "pc", "pcc", "ba", "htn", "dm", "cad", "appet", "pe", "ane"]
  # Phase 7 NHANES-native keys (additive only — never rename the UCI keys above).
  # Merged v2 derivation per D-01, unweighted per D-02.
  nhanes_csv: "data/nhanes/nhanes_ckd_multi.csv"
  # Forward split: the named SDDSRVYR cycle is held out whole. Set null to
  # fall back to the locked random split (single-cycle cohorts only).
  nhanes_holdout_cycle: 12
  nhanes_target_column: "ckd"
  nhanes_positive_label: 1
  nhanes_numeric_cols: ["RIDAGEYR", "INDFMPIR", "LBDSBUSI", "LBDSGLSI",
    "LBXSNASI", "LBXSKSI", "LBDSCASI", "LBDSPHSI",
    "LBXHGB", "LBXHCT", "LBXWBCSI", "LBXRBCSI",
    "LBXGH", "BMXBMI", "BPXOSY1", "BPXODI1",
    "LBXRDW", "LBDSUASI", "LBXSAL", "LBXSGTSI"]
  # RIDRETH1 (US race categories) and MCQ035 (US kidney-history item, 81.6%
  # missing) dropped as unfillable outside NHANES; measured cost is inside
  # noise (dev dROC -0.0015, holdout dROC -0.0031).
  nhanes_categorical_cols: ["RIAGENDR", "DMDEDUC2", "DIQ010"]
  nhanes_quarantine_cols: ["eGFR", "URXUMA", "URXUMS", "URXUCR", "URXCRS", "URDACT",
    "URDUMALC", "URDUCRLC", "LBXSCR", "LBDSCRSI", "ACR"]
  nhanes_holdout_size: 0.2
  nhanes_random_state: 42
  nhanes_cv_folds: 5
  nhanes_bootstrap_reps: 2000
  # Deployed cut-off is chosen on out-of-fold dev probabilities to reach this
  # recall; 0.5 is clinically unusable here (misses ~2/3 of true cases).
  nhanes_target_recall: 0.80

validation:
  min_rows: 300
  max_rows: 500
  fail_on_duplicates: true       # exact-duplicate raw rows fail the gate (likely capture error)

split:
  test_size: 0.2
  val_size: 0.1                  # taken from the remaining train set
  random_state: 42
  stratify: true

preprocessing:
  numeric_impute_strategy: "median"
  categorical_impute_strategy: "most_frequent"
  scale_numeric: true
  encode_categorical: "onehot"   # onehot | ordinal

logging:
  level: "INFO"
  log_dir: "logs"

mlflow:
  tracking_uri: "mlruns"
  experiment_name: "corvus-ckd"
  nhanes_experiment_name: "corvus-ckd-nhanes"

api:
  model_name: "corvus-ckd"
  pinned_version: "9"
  # v2 (NHANES-native challenger) serving slot; empty until the human gate
  # promotes a challenger version (D-04). v1 pin above is untouched.
  v2_pinned_version: "15"
  # tracking_uri honors MLFLOW_TRACKING_URI env with mlruns fallback (see
  # scripts/promote_production.py and api/model_loader.py); static default here.
  tracking_uri: "mlruns"

db:
  # database_url empty default; read from DATABASE_URL env at runtime.
  database_url: ""

auth:
  secret_key: "${SECRET_KEY:corvus-dev-secret-change-in-production}"
  algorithm: "HS256"
  access_token_expire_minutes: 30
