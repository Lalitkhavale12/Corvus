[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# If you want to use 'UTC' for the timestamp, you can set this to 'UTC'
# time zone here.
# timezone = UTC

# The version location to use when generating new migrations.
# This will default to the script_location if not specified.
# version_locations = %(here)s/../bar/versions

# The version table name to use in the database.
version_table = alembic_version

# The naming style to use when generating revision IDs.
# The value can be one of: 'uuid', 'hex', or a callable.
# naming_style = uuid

# The version path source; when there are multiple version directories,
# alembic will use the first one to write new migrations.
# version_path_source = "script"

# The output encoding when alembic writes to stdout or to a file.
# output_encoding = utf-8

sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples.

# format using "black" - use this if you don't have black installed
# or if you don't want to include black as a dependency.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
